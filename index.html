<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F0E7">
  <meta name="description" content="ШКАФ — личный стилист: собирает образы из ваших вещей по погоде и трендам сезона. Фото остаются на устройстве.">
  <title>ШКАФ — образы из ваших вещей</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ШКАФ">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#looks" data-view="looks" aria-label="ШКАФ — на главную">
        <span class="brand-mark" aria-hidden="true">Ш</span>
        <span class="brand-word">ШКАФ</span>
      </a>
      <div class="topbar-right">
        <button class="season-chip" id="seasonChip" type="button" data-view="style" aria-label="Стиль сезона">Осень–зима 2026/27</button>
        <button class="icon-btn install-btn hidden" id="installBtn" type="button" data-action="install" aria-label="Установить приложение на экран" title="Установить на экран">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v10"/><path d="M8 9.5 12 13.5l4-4"/><path d="M5 16v2.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V16"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" type="button" aria-label="Настройки">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 8.9a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.53a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.12.36.4.66.75.86.2.11.42.17.65.17H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z"/></svg>
        </button>
      </div>
    </header>

    <main id="main" class="main" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Разделы">
      <button class="tab is-active" type="button" data-view="looks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3.5 13.4 9l5.6-.6-4.2 3.8L17.6 18 12 15.1 6.4 18l2.8-5.8L5 8.4 10.6 9Z"/></svg>
        <span>Образы</span>
      </button>
      <button class="tab" type="button" data-view="wardrobe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 7.5 12 4l8 3.5v12L12 21l-8-1.5Z"/><path d="M4 7.5 12 11l8-3.5M12 11v10"/></svg>
        <span>Шкаф</span>
      </button>
      <button class="tab" type="button" data-view="style">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18c1.6 0 2-1.1 1.6-2.2-.5-1.5.6-2.8 2.2-2.8H18a3 3 0 0 0 3-3A9 9 0 0 0 12 3Z"/><circle cx="7.6" cy="11.4" r="1.1"/><circle cx="10.4" cy="7.8" r="1.1"/><circle cx="15" cy="8.2" r="1.1"/></svg>
        <span>Стиль</span>
      </button>
    </nav>

    <button class="fab" id="addBtn" type="button" aria-label="Добавить вещь">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div id="dialogRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
